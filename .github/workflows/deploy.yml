name: Admin Cloudflare staging

on:
  pull_request: {}
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: Deploy the verified build to dopa-admin-staging
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: admin-cloudflare-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  deploy-staging:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_staging
    needs: verify
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy staging Worker
        run: npm run cf:deploy:staging
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DOPA_ADMIN_STAGING_DEPLOY_ACK: I_ACKNOWLEDGE_STAGING_ADMIN_DEPLOY
