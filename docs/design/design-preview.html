<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Dopa Admin design tokens</title>
    <style>
      :root { color-scheme: light dark; --bg:oklch(0.975 0.003 275); --surface:oklch(1 0 0); --text:oklch(0.205 0.012 275); --muted:oklch(0.49 0.012 275); --border:oklch(0.895 0.006 275); --primary:oklch(0.53 0.205 295); --primary-hover:oklch(0.47 0.205 295); --on-primary:oklch(0.99 0 0); --success:oklch(0.53 0.14 153); --on-success:oklch(0.985 0.01 153); --warning:oklch(0.71 0.15 72); --on-warning:oklch(0.27 0.055 55); --danger:oklch(0.55 0.205 28); --danger-strong:oklch(0.47 0.18 28); --danger-subtle:oklch(0.965 0.018 28); --danger-subtle-hover:oklch(0.945 0.027 28); --info:oklch(0.56 0.16 255); font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif }
      @media (prefers-color-scheme: dark) { :root { --bg:oklch(0.16 0.008 275); --surface:oklch(0.195 0.009 275); --text:oklch(0.94 0.006 275); --muted:oklch(0.68 0.012 275); --border:oklch(1 0 0 / 10%); --primary:oklch(0.72 0.145 295); --primary-hover:oklch(0.78 0.13 295); --on-primary:oklch(0.16 0.025 295); --success:oklch(0.69 0.13 153); --on-success:oklch(0.15 0.03 153); --warning:oklch(0.76 0.13 72); --on-warning:oklch(0.2 0.045 55); --danger:oklch(0.67 0.18 25); --danger-strong:oklch(0.78 0.13 25); --danger-subtle:oklch(0.22 0.025 25); --danger-subtle-hover:oklch(0.25 0.035 25); --info:oklch(0.72 0.12 255) } }
      * { box-sizing:border-box } body { margin:0; background:var(--bg); color:var(--text) } main { max-width:1080px; margin:auto; padding:48px 24px } h1 { margin:0; font-size:28px } p { color:var(--muted); line-height:1.6 } section { margin-top:32px; border:1px solid var(--border); border-radius:12px; background:var(--surface); padding:24px } .swatches { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px } .swatch { min-height:96px; border-radius:8px; padding:12px; display:flex; align-items:flex-end; font-size:12px; font-weight:700 } .swatch.primary { background:var(--primary); color:var(--on-primary) } .swatch.success { background:var(--success); color:var(--on-success) } .swatch.warning { background:var(--warning); color:var(--on-warning) } .swatch.danger { background:var(--danger); color:white } .swatch.info { background:var(--info); color:white } .controls { display:flex; flex-wrap:wrap; gap:8px } button { min-height:36px; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); padding:0 14px; font-weight:650 } button.primary { background:var(--primary); border-color:var(--primary); color:var(--on-primary) } button.primary:hover { background:var(--primary-hover) } button.destructive { background:var(--danger-subtle); border-color:transparent; color:var(--danger-strong) } button.destructive:hover { background:var(--danger-subtle-hover) } table { width:100%; border-collapse:collapse; font-size:14px } th,td { height:44px; padding:0 12px; border-bottom:1px solid var(--border); text-align:left } th { color:var(--muted); font-size:12px; letter-spacing:.06em; text-transform:uppercase }
    </style>
  </head>
  <body>
    <main>
      <h1>Dopa Admin</h1>
      <p>Neutral operations system · semantic color · dense information hierarchy</p>
      <section><h2>Semantic color</h2><div class="swatches"><div class="swatch primary">Primary</div><div class="swatch success">Success</div><div class="swatch warning">Warning</div><div class="swatch danger">Danger</div><div class="swatch info">Information</div></div></section>
      <section><h2>Controls</h2><div class="controls"><button class="primary">주 작업</button><button>보조 작업</button><button class="destructive">삭제</button><button disabled>처리 중</button></div></section>
      <section><h2>Data density</h2><table><thead><tr><th>Queue</th><th>Status</th><th>Updated</th></tr></thead><tbody><tr><td>신고 검토</td><td>확인 필요</td><td>방금 전</td></tr><tr><td>환불 처리</td><td>정상</td><td>12분 전</td></tr></tbody></table></section>
    </main>
  </body>
</html>
